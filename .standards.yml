# Every repo that consumes these standards carries one of these files. The
# reusable workflows read `visibility` from it to decide whether the leakage scan
# runs; no other key changes a gate yet. Selecting gates from `profile` and
# `stacks` is planned in XeroIP/standards#44. Opting out is a visible declaration
# in the repo, never a quietly disabled workflow.
#
# See docs/documentation/structure.md for what each profile means.

version: 1

# What each profile is meant to select. Today all three run the same
# documentation gates, because no language gates exist yet; selection is planned
# in XeroIP/standards#44.
#
# docs-only  — prose and Markdown gates only, no language tooling
# mixed      — docs gates plus the language gates matching `stacks`
# code       — all gates; docs gates apply to docs/ only
profile: docs-only

# Whether this repository is public. A different axis from `profile`: that
# says what kind of code a repo holds, this says who can read it. A private
# repo documenting real infrastructure is supposed to contain real
# hostnames, so the leakage scan applies to public repos only.
#
# GitHub's own view of the repository wins. This can only make the gate
# stricter — a private repo declaring `public` opts in ahead of going
# public; a public repo declaring `private` changes nothing.
visibility: public

# Languages present in this repo. The sync prints them in the generated agent
# file; selecting gates from them is planned in XeroIP/standards#44.
stacks: []

# Repos differ deliberately. These keys record a repo's own practice, for people
# and agents to read, rather than a house rule with exceptions. No workflow or
# tool reads them yet.
workflow:
  require_issue: false
  allow_direct_to_main: false

# The standards release this repo is synced against. A sync run from any other
# version warns and still vendors it, and the comparison ignores the
# commits-since suffix, so a tree one commit past this tag passes without a
# warning. Making the pin authoritative is XeroIP/standards#45. Each sync
# rewrites this line to the version it vendored, so it records what the repo
# holds.
standards_version: v0.1.0

sync:
  # Explicit consent to be written to. The first sync replaces AGENTS.md,
  # CLAUDE.md and .github/copilot-instructions.md, so carrying a .standards.yml
  # is not on its own permission to overwrite them. The sync refuses until this
  # is true, and refuses anyway if one of those files exists without the
  # generated banner — a file a person wrote is not the bot's to replace.
  adopted: true

  # Paths under .standards/ the sync bot must not overwrite when it vendors the
  # standards in, written relative to .standards/ (docs/coding/bash.md). One
  # that exists is kept as it is; every run says so.
  protect: []

  # Regions of the generated agent files that another tool maintains, by the
  # name in their markers (<!-- name:start ... --> to <!-- name:end -->). The
  # sync refuses a generated file edited since the last sync; a declared region
  # is left out of that check, and every run prints where it is and how much of
  # the file it covers. The sync doesn't carry the region into the file it
  # writes: a tool whose text has to persist keeps it in a file of its own,
  # such as one under .claude/rules/.
  managed_regions: []
