# External links only. Internal link integrity is checked at build time by
# tools/check-docs.py, which resolves every relative path in under a second and
# needs no network — so it gates every push while this does not.
scheme = ["https", "http"]

# Codes meaning "the link is real but the bot is being turned away".
accept = [200, 206, 301, 302, 403, 429]

exclude = [
  # Placeholders used throughout the standards. They are meant not to resolve.
  "^https?://example\\.internal",
  "^https?://service-[a-z]",

  # This repository's own release and compare links, as written in CHANGELOG.md.
  # A changelog announces a release before its tag exists, so while the release
  # is still a pull request these 404 by construction — and the alternative is
  # cutting the tag before the change is reviewed, which points a permanent tag
  # at unreviewed history.
  #
  # Narrow on purpose: only this repo, only the release and compare paths. A
  # broken link to anything else here is still a finding.
  "^https://github\\.com/XeroIP/standards/(releases/tag|compare)/",
]

# Test fixtures carry deliberately fictional URLs so the leak scanner's failure
# path is exercised rather than assumed. Resolving them is not the point and
# cannot succeed — one returned 503 and failed this job, which is the check
# working correctly on content it should never have been given.
exclude_path = [
  "tests/fixtures",
]

timeout = 30
retry_wait_time = 15
max_retries = 3
user_agent = "lychee/link-checker"
