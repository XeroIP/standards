# This repo held to its own standards, plus the check that keeps every generated
# file honest: re-run each generator and fail if the result differs from what is
# committed. Without it, a derived file drifts from its source silently, which is
# the failure this whole repo exists to prevent.
name: Self check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # npm ci, not npm install: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is the property that makes
      # a generator's output reproducible.
      - name: Install pinned dependencies
        run: npm ci

      - name: Agent files match AGENTS.md
        run: node tools/build-agent-files.js --check

      - name: llms.txt matches the docs tree
        run: node tools/build-llms-txt.js --check

      # git status, not git diff: diff ignores untracked files, so a generated
      # file that was never committed (a new rule's style, a new adapter) came
      # back from the generator untracked and the step passed. --porcelain lists
      # modified, deleted and untracked files alike.
      - name: Vale config and the prose README's count match rules.yml
        run: |
          node tools/build-vale.js
          stale=$(git status --porcelain -- .vale.ini styles/ docs/prose/README.md)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "styles/, .vale.ini or the count in docs/prose/README.md is stale. Run: node tools/build-vale.js"
            exit 1
          fi

      # The generator also fails on its own if a stylesheet reads a token it
      # doesn't define, or sets a severity token outside the opt-in block.
      - name: tokens.css and the design adapters match tokens.json
        run: |
          node docs/design/build-adapters.js
          stale=$(git status --porcelain -- docs/design/tokens.css docs/design/adapters/)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "tokens.css or the adapters are stale. Run: node docs/design/build-adapters.js"
            exit 1
          fi

      - name: Design tokens pass WCAG AA in both themes
        run: node docs/design/check-contrast.js

      # The counts in check-leakage.py's docstring are measured over this tree.
      # Written by hand they go stale unnoticed; regenerated, a drift fails here.
      - name: Leakage gap counts match the tree
        run: python3 tools/build-leakage-gaps.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Structure, naming, front matter, and internal links
        run: python3 tools/check-docs.py docs/

      # nofilter: by default reviewdog keeps only findings on lines a pull
      # request adds, so an error on any other line failed the push run and
      # passed the pull request run on the same commit.
      - name: Prose
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          vale_flags: --minAlertLevel=warning
          fail_on_error: true
          filter_mode: nofilter

      # On the Vale binary the step above installed into the tool cache, so a
      # Vale release that changes how a scope counts fails here. If the cache
      # moves, find comes back empty, the test looks for vale on PATH, which a
      # hosted runner doesn't have, and exits 2.
      - name: Frequency caps count across the whole page
        run: |
          VALE="$(find "$RUNNER_TOOL_CACHE/vale" -type f -name vale 2>/dev/null | head -n 1)"
          export VALE
          bash tests/test-vale.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      # This repository's own check that the leakage gate still fires — not a
      # gate for consuming repos. It lived in secret-scan.yml, where every
      # consuming repo ran it against a tests/ directory that exists only here
      # and failed on the missing file. The fixtures carry leak-shaped values on
      # purpose, so the failure path is exercised rather than assumed.
      - name: Leakage scan fixtures still fire
        run: bash tests/test-leakage.sh

      # Offline. The weekly refresh fetches; this only proves the committed
      # list is IANA's format and long enough to be the whole list.
      - name: IANA suffix list is well-formed
        run: python3 tools/update-tlds.py --check

  # The gitleaks configuration's own test; secret-scan.yml runs the scan
  # itself. The release is the one secret-scan.yml and the pre-commit hook pin,
  # installed from its release tarball and checked against a recorded checksum
  # rather than trusted by tag.
  gitleaks-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks 8.30.0
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks flags the fixture, and the config excludes only its directory
        run: bash tests/test-gitleaks.sh

  links:
    # External links break for reasons unrelated to the change under review, so
    # this runs on a schedule and on docs changes — never as a gate on an
    # unrelated PR. Split taken from XeroIP/sr177-weber-analysis.
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'docs')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
