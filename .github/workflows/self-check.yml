# This repo held to its own standards, plus the check that keeps every generated
# file honest: re-run each generator and fail if the result differs from what is
# committed. Without it, a derived file drifts from its source silently, which is
# the failure this whole repo exists to prevent.
name: Self check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Agent files match AGENTS.md
        run: node tools/build-agent-files.js --check

      - name: llms.txt matches the docs tree
        run: node tools/build-llms-txt.js --check

      - name: Vale config matches rules.yml
        run: |
          node tools/build-vale.js
          git diff --exit-code -- .vale.ini styles/ \
            || { echo "styles/ or .vale.ini is stale. Run: node tools/build-vale.js"; exit 1; }

      - name: Design adapters match tokens.json
        run: |
          node docs/design/build-adapters.js
          git diff --exit-code -- docs/design/adapters/ \
            || { echo "adapters are stale. Run: node docs/design/build-adapters.js"; exit 1; }

      - name: Design tokens pass WCAG AA in both themes
        run: node docs/design/check-contrast.js

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Structure, naming, front matter, and internal links
        run: python3 tools/check-docs.py docs/

      - name: Prose
        uses: errata-ai/vale-action@d89dee975228ae261d22c15adcd03578634d429c # v2.1.1
        with:
          vale_flags: --minAlertLevel=warning
          fail_on_error: true

  links:
    # External links break for reasons unrelated to the change under review, so
    # this runs on a schedule and on docs changes — never as a gate on an
    # unrelated PR. Split taken from XeroIP/sr177-weber-analysis.
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'docs')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
