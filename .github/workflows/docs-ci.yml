# Reusable documentation gate. Consuming repos call it:
#
#   jobs:
#     docs:
#       uses: XeroIP/standards/.github/workflows/docs-ci.yml@<40-char-sha>  # v0.1.0
#
# Pinned to a SHA, not a tag. A tag is mutable: moving it changes what this gate
# accepts in every repo that calls it, with no pull request anywhere. That is the
# argument this repo already makes for third-party actions, and it applies to
# first-party workflows for the same reason.
#
# Nothing bumps that pin automatically yet. Bump it by hand when this file
# changes, which is rare — the rules it runs move independently of it. See the
# Versioning section of AGENTS.md for why per-repo Dependabot was rejected and
# what is intended instead.
#
# This workflow does NOT fetch the standards repository. It runs the copy already
# vendored in the calling repo at `.standards/`, written by the sync bot and
# landed through a reviewed pull request. That is deliberate: vendoring the rules
# while fetching the enforcer from a mutable ref meant a repo could be failed by
# rules that differ from the ones sitting in its own tree.
name: Documentation

on:
  workflow_call:
    inputs:
      docs-path:
        description: Directory holding the documentation tree.
        type: string
        default: docs

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A repo that has never synced has no rules to be judged by. Say so once,
      # clearly, rather than letting three later steps fail on missing paths.
      - name: Check the standards are vendored
        run: |
          if [ ! -d .standards ]; then
            echo "::error::.standards/ is missing. This repo has not been synced."
            echo "Run the standards-sync workflow, or from a clone of XeroIP/standards:"
            echo "  python3 tools/sync-standards.py --target <path to this repo>"
            exit 1
          fi
          for f in tools/check-docs.py .vale.ini .markdownlint-cli2.jsonc styles; do
            if [ ! -e ".standards/$f" ]; then
              echo "::error::.standards/$f is missing — the vendored copy predates the change"
              echo "that ships the enforcers alongside the rules. Re-run the sync."
              exit 1
            fi
          done
          echo "Standards version: $(cat .standards/VERSION 2>/dev/null || echo unknown)"

      - name: Read the repo profile
        id: profile
        run: |
          if [ -f .standards.yml ]; then
            profile=$(grep -E '^profile:' .standards.yml | head -1 | cut -d: -f2 | tr -d ' "'"'"'')
          else
            profile=mixed
          fi
          echo "profile=${profile:-mixed}" >> "$GITHUB_OUTPUT"
          echo "Profile: ${profile:-mixed}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Structure, naming, front matter, and internal links
        run: python3 .standards/tools/check-docs.py "${{ inputs.docs-path }}"

      - name: Prose
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: ${{ inputs.docs-path }}
          vale_flags: --config=.standards/.vale.ini --minAlertLevel=warning
          fail_on_error: true

      # No `globs:` here. The config owns which files are linted and which are
      # ignored; passing globs on the command line overrides it, which is how
      # the ignore list came to be silently bypassed.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .standards/.markdownlint-cli2.jsonc
