# Secret and leakage scan. Reusable, and also run on this repo by self-check.yml.
#
# Two layers, because they catch different things. gitleaks finds credential
# shapes. The leakage scan finds real infrastructure that is not secret at all
# but should not be public — a hostname, a private-range address, a live path.
# The second is the likelier failure for a standards repo.
#
# The scan works from an allowlist rather than a denylist: it reports anything
# infrastructure-shaped that is not explicitly permitted. A denylist would have
# to name the values it protects, which in a public repository publishes them.
name: Secret scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Leakage scan
        run: python3 tools/check-leakage.py

      - name: Leakage scan fixtures still fire
        run: bash tests/test-leakage.sh
