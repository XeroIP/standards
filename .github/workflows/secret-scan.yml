# Secret and leakage scan. Reusable, and also run on this repo by self-check.yml.
#
# Two layers, because they catch different things. gitleaks finds credential
# shapes. The leakage scan finds real infrastructure that is not secret at all
# but should not be public — a hostname, a private-range address, a live path.
# The second is the likelier failure for a standards repo.
#
# The scan works from an allowlist rather than a denylist: it reports anything
# infrastructure-shaped that is not explicitly permitted. A denylist would have
# to name the values it protects, which in a public repository publishes them.
name: Secret scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named explicitly rather than relying on gitleaks' root-file default,
          # so the allowlist is found the same way when this workflow is called
          # from a consuming repo as when it runs here.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Leakage scan
        run: python3 tools/check-leakage.py

      - name: Leakage scan fixtures still fire
        run: bash tests/test-leakage.sh
