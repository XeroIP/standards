# Secret and leakage scan. Reusable, and also runs on this repo directly.
#
# Two layers, because they catch different things and apply to different
# repositories:
#
#   gitleaks       Every repository. A credential belongs in none of them.
#   leakage scan   Public repositories only. It reports real hostnames,
#                  addresses and live paths — which in a private repository
#                  documenting real infrastructure are the correct content.
#
# Running the second everywhere turns CI red on documentation that is exactly
# right, which is how a gate stops being trusted and starts being worked around.
#
# The scan works from an allowlist rather than a denylist: it reports anything
# infrastructure-shaped that is not explicitly permitted. A denylist would have
# to name the values it protects, which in a public repository publishes them.
name: Secret scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      # The repository's own config when it has one, otherwise the copy the
      # sync vendors into .standards/, otherwise gitleaks' default rules. Naming
      # the root file unconditionally failed every consuming repository that
      # had not hand-added one, and the leakage scan below was skipped behind
      # that failure.
      - name: Which gitleaks config
        id: gitleaks-config
        run: |
          config=""
          for candidate in .gitleaks.toml .standards/.gitleaks.toml; do
            if [ -f "$candidate" ]; then
              config="$GITHUB_WORKSPACE/$candidate"
              break
            fi
          done
          echo "path=$config" >> "$GITHUB_OUTPUT"
          echo "gitleaks config: ${config:-none, so the default rules}"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty means gitleaks' default rules: gitleaks treats an empty value
          # as unset and finds no root file, because the step above looked.
          GITLEAKS_CONFIG: ${{ steps.gitleaks-config.outputs.path }}
          # The release the pre-commit hook pins. Unset, the action chose its
          # own (8.24.3), so the hook and CI enforced different rule sets.
          # tests/test-gitleaks.sh fails if the two disagree.
          GITLEAKS_VERSION: '8.30.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # GitHub's own view of the repository decides, and a declaration can only
      # make this stricter. A private repo may opt in because it is going public
      # later; a public repo cannot opt out, because a real value reaching a
      # public history is the one thing this gate exists to stop. Reading the
      # declaration alone would let a single wrong line disable it silently.
      #
      # An unknown visibility is treated as public, so the failure direction is
      # a noisy gate rather than a quiet leak.
      - name: Does the leakage scan apply here
        id: applies
        run: |
          declared=""
          if [ -f .standards.yml ]; then
            declared=$(grep -E '^visibility:' .standards.yml | head -1 \
              | cut -d: -f2- | cut -d'#' -f1 | tr -d " \"'") || true
          fi

          if [ "${{ github.event.repository.private }}" != "true" ]; then
            run=yes; why="repository is public"
          elif [ "$declared" = "public" ]; then
            run=yes; why="private, but .standards.yml declares visibility: public"
          else
            run=no; why="repository is private"
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "leakage scan: $run — $why"

      # The vendored copy where there is one, so a repo runs the same commit's
      # checker as the rules in its own tree, and this repo's own copy
      # otherwise. The previous hardcoded `tools/` path resolved only here, so a
      # consuming repo failed on a missing file before reaching the question
      # above.
      #
      # A repo's own legitimately-public values go in .leakage-allowlist.txt at
      # its root. That supplement is additive: the vendored allowlist still
      # applies, so a repo cannot weaken the shared rules by declaring its own.
      - name: Leakage scan
        if: steps.applies.outputs.run == 'yes'
        run: |
          checker=tools/check-leakage.py
          if [ -f .standards/tools/check-leakage.py ]; then
            checker=.standards/tools/check-leakage.py
          fi

          if [ -f .leakage-allowlist.txt ]; then
            python3 "$checker" --allowlist-extra .leakage-allowlist.txt
          else
            python3 "$checker"
          fi
