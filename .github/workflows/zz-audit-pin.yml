# deliberate break (enforcement audit): a third-party action pinned by tag.
# Dispatch-only so it never runs; policy-pinned-actions.yml reads it as text.
name: Audit pin probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: errata-ai/vale-action@v2.1.1
