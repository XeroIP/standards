# Throwaway: shows how `inputs.apply` evaluates on a non-dispatch event, the
# condition standards-sync.yml's Sync step depends on. Deleted with this branch.
name: Audit inputs context
on:
  push:
    branches: [audit/gate-exercise]
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show the context
        run: echo "event=${{ github.event_name }} apply=[${{ inputs.apply }}]"
      - name: Gated like the Sync step
        if: inputs.apply
        run: echo "would sync"
