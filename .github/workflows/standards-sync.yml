# Reports, and on request opens, a PR in each consuming repo that vendors the
# current standards and regenerates its agent files.
#
# Vendoring rather than submoduling puts the rules in the working tree an agent
# already has: no network fetch, no submodule to go stale, and no indirection an
# LLM tool might not follow. Generalises the base-plus-tail sync already working
# in XeroIP/copilot-memory, with repos in place of hosts.
#
# **A manual run reports by default and writes nothing.** Opening a pull
# request in someone else's repository is not something to switch on and hope:
# the sync replaces three top-level files, and a repo with a hand-written
# CLAUDE.md loses it. `apply` has to be asked for by hand. A published release
# applies, because cutting it is that request. Either way the job waits for the
# sync environment's reviewer before the token is handed over, and the consent
# gates in sync-standards.py apply.
#
# There's no schedule. A required reviewer suits a deliberate act: someone just
# cut a release, or asked for a run, so someone is there to approve it. An
# unattended weekly run queued at the same gate and waited there; three did,
# for three weeks, and reported nothing.
name: Sync standards

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/repo list, of repos listed below. Empty means all of them.
        type: string
        default: ''
      apply:
        description: Open pull requests. Unchecked reports what would change and writes nothing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    # STANDARDS_SYNC_TOKEN lives here rather than as a repository secret, so it
    # is scoped to this job instead of being readable by every workflow in a
    # public repository — including any future one that runs on pull_request,
    # where a fork would be handed a token with write access to other repos.
    #
    # Add a required reviewer on the environment and the token is released only
    # after a person approves the run. That is the same decision as `apply`,
    # enforced in a second place: one says write, the other hands over the means.
    #
    # Not an organization secret: this token is deliberately scoped to a listed
    # set of repositories, and an org secret widens reach to all of them.
    environment: sync

    strategy:
      fail-fast: false
      matrix:
        # A repo joins by being listed here AND setting `sync.adopted: true` in
        # its own .standards.yml. Membership is explicit at both ends: listing
        # is this repo's intent, the flag is the other repo's consent.
        repo:
          - XeroIP/my-unraid-notes
    steps:
      # `repos` narrows a manual run to the repos it names. Nothing read it, so
      # a run asked to write to one repo would have written to every one listed.
      - name: Is this repo in scope?
        id: scope
        env:
          REPOS: ${{ inputs.repos }}
          REPO: ${{ matrix.repo }}
        run: |
          set -f
          if [ -z "$REPOS" ] || printf '%s\n' $REPOS | grep -qxF "$REPO"; then
            echo "in=true" >> "$GITHUB_OUTPUT"
          else
            echo "in=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REPO isn't in the repos input; skipped."
          fi

      - name: Check out the standards
        if: steps.scope.outputs.in == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: standards
          # A release syncs that released tag. A manual run reads the default
          # branch, and writes only when `apply` is set.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Check out the target
        if: steps.scope.outputs.in == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: target
          token: ${{ secrets.STANDARDS_SYNC_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.in == 'true'
        with:
          python-version: '3.12'

      # Three outcomes, and only one of them is a failure.
      #
      #   0  up to date
      #   1  out of date — information, not a failure, so it is captured
      #   3  refused — no consent, an agent file this tool did not write, or
      #      one edited since the last sync outside its declared regions
      #
      # A refusal is a hard failure when `apply` asked for a write: the run was
      # told to do something and did not. On a release or a preview it is a
      # status: a repo that hasn't adopted yet, or one with an edit to settle,
      # shouldn't turn every release red for every other repo's run. A check
      # that is red for someone else's reasons is one people stop reading.
      #
      # The refusal is still printed either way, and surfaced in the step
      # summary so it is visible without opening the log.
      - name: What would change
        id: preview
        if: steps.scope.outputs.in == 'true'
        run: |
          set +e
          out=$(python3 standards/tools/sync-standards.py --target target --check 2>&1)
          rc=$?
          set -e
          echo "$out"

          case "$rc" in
            3)
              echo "changes=no" >> "$GITHUB_OUTPUT"
              echo "refused=yes" >> "$GITHUB_OUTPUT"
              {
                echo "### ${{ matrix.repo }} — refused"
                echo
                echo '```'
                echo "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${{ inputs.apply }}" = "true" ]; then
                echo "::error::${{ matrix.repo }} refused the sync, and apply was requested."
                exit 3
              fi
              echo "::notice::${{ matrix.repo }} refused the sync; the reasons are printed above. Nothing to do."
              ;;
            1)
              echo "changes=yes" >> "$GITHUB_OUTPUT"
              echo "refused=no" >> "$GITHUB_OUTPUT"
              {
                echo "### ${{ matrix.repo }} — out of date"
                echo
                echo '```'
                echo "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            0)
              echo "changes=no" >> "$GITHUB_OUTPUT"
              echo "refused=no" >> "$GITHUB_OUTPUT"
              echo "### ${{ matrix.repo }} — up to date" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::sync-standards.py exited $rc"
              exit "$rc"
              ;;
          esac

      # A release applies; a manual run applies only when asked.
      - name: Sync
        if: (github.event_name == 'release' || inputs.apply) && steps.preview.outputs.changes == 'yes'
        run: python3 standards/tools/sync-standards.py --target target

      - name: Open a PR if anything changed
        if: (github.event_name == 'release' || inputs.apply) && steps.preview.outputs.changes == 'yes'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: target
          token: ${{ secrets.STANDARDS_SYNC_TOKEN }}
          branch: standards/sync
          title: 'chore: sync engineering standards'
          commit-message: |
            chore: sync engineering standards

            Vendors .standards/, regenerates AGENTS.md, CLAUDE.md, and
            .github/copilot-instructions.md from XeroIP/standards, and sets
            standards_version in .standards.yml to the version vendored.

            Everything under .standards/ is derived and is replaced wholesale on
            each sync, except paths listed in sync.protect. Repo-specific
            instructions belong in .standards-tail.md, which this never touches.
          body: |
            Automated sync from [XeroIP/standards](https://github.com/XeroIP/standards).

            `.standards/` is derived — edits there are lost on the next sync.
            Change the standard upstream instead. Anything specific to this repo
            goes in `.standards-tail.md`, which the sync never overwrites.
          labels: standards, automated
